<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <title>Cadastrar Produto</title>
    <style>
        body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .box { background: #fff; border-radius: 10px; border: 1px solid #dee2e6; padding: 2rem; }
        h1 { color: #343a40; }
    </style>
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <div class="box shadow-sm">
        <h1 class="mb-4">Cadastrar Produto</h1>

        <form th:action="@{/cadastrar}" th:object="${produto}" method="post">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input class="form-control" type="text" th:field="*{nome}" placeholder="Ex: Camiseta, Notebook...">
                <small class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$)</label>
                <input class="form-control" type="number" th:field="*{preco}" step="0.01" placeholder="Ex: 49.90">
                <small class="text-danger" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></small>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select class="form-control" th:field="*{categoria}">
                    <option value="">Selecione...</option>
                    <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                </select>
                <small class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small>
            </div>

            <div class="form-group">
                <label for="estoque">Estoque</label>
                <input class="form-control" type="number" th:field="*{estoque}" placeholder="Ex: 10">
                <small class="text-danger" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></small>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input class="form-control" type="text" th:field="*{descricao}" placeholder="Opcional">
            </div>

            <button class="btn btn-primary" type="submit">Cadastrar</button>
            <a th:href="@{/lista}" class="btn btn-secondary">Ver lista de produtos</a>
        </form>
    </div>
</div>
</body>
</html>
